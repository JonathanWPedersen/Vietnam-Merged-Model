<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        Vietnam Merged Model — Scenarios
    </title>

    <style>
        body {
            margin: 0;
            background: #f4f7fb;
            color: #18212f;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 32px 26px 56px;
        }

        section {
            margin-top: 24px;
            padding: 20px;
            background: white;
            border: 1px solid #d9e0e8;
            border-radius: 8px;
        }

        .plots {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(480px, 1fr)
                );
            gap: 18px;
        }

        img {
            width: 100%;
            border: 1px solid #d9e0e8;
        }

        pre {
            padding: 12px;
            overflow-x: auto;
            background: #f3f5f7;
        }
    </style>
</head>

<body>
    <main>
        <h1>
            Vietnam Merged Model — Scenario Report
        </h1>

        <section>
            <h2>Scenarios</h2>
<h3>Rice Export Shock</h3>
<pre>(export_growth = Dict(:rice_agriculture =&gt; 0.02),)</pre>
</section>
<section>
