<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        Vietnam Merged Model — Scenarios
    </title>

    <style>
        body {
            margin: 0;
            background: #f4f7fb;
            color: #18212f;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 32px 26px 56px;
        }

        section {
            margin-top: 24px;
            padding: 20px;
            background: white;
            border: 1px solid #d9e0e8;
            border-radius: 8px;
        }

        .plots {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(480px, 1fr)
                );
            gap: 18px;
        }

        img {
            width: 100%;
            border: 1px solid #d9e0e8;
        }

        pre {
            padding: 12px;
            overflow-x: auto;
            background: #f3f5f7;
        }
    </style>
</head>

<body>
    <main>
        <h1>
            Vietnam Merged Model — Scenario Report
        </h1>

        <section>
            <h2>Scenarios</h2>
<h3>Industrial Export Slowdown</h3>
<pre>(export_growth = Dict(:industry =&gt; Dict(2029 =&gt; 0.09, 2026 =&gt; 0.04)),)</pre>
</section>
<section>
    <h2>XS – industry</h2>

    <div class="plots">
        <img
            src="plots/XS_industry_levels.png"
            alt="XS – industry levels"
        >

        <img
            src="plots/XS_industry_deviation.png"
            alt="XS – industry deviation"
        >
    </div>
</section>

<section>
    <h2>X</h2>

    <div class="plots">
        <img
            src="plots/X_levels.png"
            alt="X levels"
        >

        <img
            src="plots/X_deviation.png"
            alt="X deviation"
        >
    </div>
</section>

<section>
    <h2>M</h2>

    <div class="plots">
        <img
            src="plots/M_levels.png"
            alt="M levels"
        >

        <img
            src="plots/M_deviation.png"
            alt="M deviation"
        >
    </div>
</section>

    </main>
</body>
</html>
